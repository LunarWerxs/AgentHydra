# Release: compile real executables for every OS and publish them with versioned changelog notes.
#
# Trigger: pushing a version tag (v0.2.1). The release is published automatically only after every
# build and smoke job succeeds.
#
# workflow_dispatch is gated the same way, on `github.ref_type == 'tag'` rather than on the event:
# dispatching against a BRANCH runs build + smoke and publishes nothing (validating the pipeline
# without a tag), while dispatching against a TAG ref is a real, publishing release. That second
# case is not a curiosity — on 2026-08-06 a GitHub Actions incident throttled webhook triggers, so
# `git push origin v0.16.0` created the tag and fired no run at all. `gh workflow run release.yml
# --ref v0.16.0` was what actually shipped it. See docs/RELEASING.md.
#
# Design notes (verified 2026-07-16 against a real compiled exe on Windows):
# - `bun build --compile` cross-compiles every POSIX target (minified) from one Linux runner. The
#   windows-x64 leg runs on windows-latest UNMINIFIED: --minify alone panics Bun 1.3.14 when the
#   compile host is Windows (isolated locally; the exact same --minify is fine cross-compiling from
#   Linux). --windows-icon/--windows-title are host-gated to Windows but otherwise fine, so the
#   Windows leg applies them natively at compile time (no post-processing tool). What compiling does
#   NOT prove is that the binary RUNS — the smoke job boots each bundle on real hardware for its OS
#   and asserts /api/health, because the failure modes here (virtual import.meta.dir paths, the
#   implicit-serve entrypoint trap) all pass the build and only explode at runtime.
# - The SPA is embedded into the executable by scripts/build.ts. Windows publishes both a direct
#   exe and a smaller updater zip; Unix targets publish updater tarballs. Each archive has one
#   versioned wrapper directory containing only the executable. That wrapper preserves the update
#   path from older CC Manager UI releases (the pre-rename name), whose updater expects it. There
#   are no web/, node_modules/,
#   source-map, or tray-script sidecars.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-x64 builds ON Windows so --windows-icon works; everything else cross-compiles
          # from one Linux runner.
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: darwin-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PKG_V=$(bun -e 'console.log(require("./package.json").version)')
          TAG_V="${GITHUB_REF_NAME#v}"
          if [ "$PKG_V" != "$TAG_V" ]; then
            echo "tag v$TAG_V does not match package.json version $PKG_V — bump package.json (and CHANGELOG) first"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web SPA
        run: bun run --cwd web build

      - name: Compile + package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          target="${{ matrix.target }}"
          name="AgentHydra-${VERSION}-${target}"
          stage="tmp/release-stage"
          rm -rf "$stage"
          mkdir -p "$stage/$name" out
          if [ "$target" = "windows-x64" ]; then
            # NO --minify: on a WINDOWS compile host --minify alone panics Bun 1.3.14 outright
            # ("Crashed while printing main.ts" — isolated locally 2026-07-16 to --minify specifically;
            # --windows-icon/--windows-title are innocent, they only appeared guilty when paired with
            # --minify, and the same --minify works fine on the Linux legs). The native Windows
            # resource flags DO work on a Windows host (they're only unavailable when cross-compiling
            # from Linux), so the icon + title are applied at compile time — no rcedit post-step.
            # Unminified costs a few MB.
            bun run scripts/build.ts --skip-web --target "$target" \
              --outfile "${stage}/${name}/AgentHydra.exe"
            "${stage}/${name}/AgentHydra.exe" --version   # canary: the compiled exe runs
            cp "${stage}/${name}/AgentHydra.exe" "out/${name}.exe"
            # windows-latest has 7z on PATH; git-bash there has no `zip`
            (cd "$stage" && 7z a -tzip "$GITHUB_WORKSPACE/out/${name}.zip" "$name" > /dev/null)
          else
            bun run scripts/build.ts --skip-web --target "$target" \
              --outfile "${stage}/${name}/agenthydra"
            tar -C "$stage" -czf "out/${name}.tar.gz" "$name"
          fi
          rm -rf "$stage"
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            out/*.zip
            out/*.tar.gz
            out/*.exe
          if-no-files-found: error
          # These are large binaries only consumed by the smoke + release jobs in THIS run
          # (or nobody, on a workflow_dispatch validation run). No reason to keep them 90 days.
          retention-days: 3

  # Boot each bundle and assert --version + /api/health + served SPA. This catches the
  # compiled-only runtime bugs a green compile can't (virtual import.meta.dir paths, the
  # implicit-serve trap). Native runners for x64 Linux / Windows / arm64 macOS; linux-arm64 is
  # booted under QEMU on the x64 runner (no free native ARM-Linux runner). darwin-x64 (Intel mac)
  # is the ONE target that stays build-only-verified: GitHub retired its Intel macOS runners, so
  # there is no honest way to boot it in CI — a documented, deliberate gap, not a silent one.
  smoke:
    name: smoke (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bin: agenthydra
          - os: ubuntu-latest
            target: linux-arm64
            bin: agenthydra
            qemu: true
          - os: windows-latest
            target: windows-x64
            bin: AgentHydra.exe
          - os: macos-latest # arm64 runner
            target: darwin-arm64
            bin: agenthydra
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: out

      # linux-arm64 runs inside an arm64 container via binfmt/QEMU emulation on the x64 runner.
      - name: Set up QEMU (arm64 emulation)
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Unpack the bundle
        shell: bash
        run: |
          cd out
          case "${{ matrix.target }}" in
            windows-*) bundle=$(ls AgentHydra-*-${{ matrix.target }}.zip | head -1) ;;
            *) bundle=$(ls AgentHydra-*-${{ matrix.target }}.tar.gz | head -1) ;;
          esac
          echo "smoking $bundle"
          mkdir smoke
          case "$bundle" in
            *.zip) unzip -q "$bundle" -d smoke ;;
            *) tar -xzf "$bundle" -C smoke ;;
          esac
          test "$(find smoke -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          bundle_dir=$(find smoke -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$bundle_dir"
          echo "BUNDLE_DIR=out/$bundle_dir" >> "$GITHUB_ENV"

      # The actual boot+assert, factored so native and QEMU paths run identical checks.
      - name: Boot + assert (native)
        if: '!matrix.qemu'
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
        run: |
          cd "$BUNDLE_DIR"
          chmod +x "$BIN" 2>/dev/null || true
          "./$BIN" --version
          export AGENTHYDRA_HOME="$RUNNER_TEMP/ccm-smoke-home"
          export AGENTHYDRA_NO_OPEN=1
          PORT=7797 "./$BIN" > daemon.out 2>&1 &
          ok=""
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7797/api/health > health.json 2>/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ -z "$ok" ]; then echo "daemon never served /api/health"; cat daemon.out; exit 1; fi
          cat health.json; echo
          grep -q '"service":"agenthydra"' health.json
          grep -q '"distribution":"compiled"' health.json
          curl -sf http://127.0.0.1:7797/ > index.html
          grep -qi '<!doctype html' index.html
          asset=$(grep -Eo "/assets/[^\"']+\.(js|css)" index.html | head -1)
          test -n "$asset"
          curl -sf "http://127.0.0.1:7797${asset}" > frontend-asset
          test -s frontend-asset

      - name: Boot + assert (arm64 under QEMU)
        if: matrix.qemu
        shell: bash
        run: |
          # arm64 Debian container (binfmt routes it through QEMU). --version proves the emulated
          # binary at least loads + runs; a full daemon boot under QEMU is slow/flaky, so the arm64
          # leg asserts the launch, and the native x64 leg covers the serving behavior.
          docker run --rm --platform linux/arm64 -v "$PWD/$BUNDLE_DIR:/app" -w /app \
            arm64v8/debian:stable-slim ./agenthydra --version

  release:
    name: publish the GitHub release
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no release section for ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Build checksums
        shell: bash
        run: sha256sum out/* > out/SHA256SUMS.txt

      # Idempotent: a retry updates the existing release in place and replaces its platform assets
      # instead of deleting the release or creating an orphaned draft.
      - name: Publish release with binaries attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Archives go first so pre-transition updaters, which selected the first matching
            # target asset, receive a bundle rather than the new human-facing direct executable.
            gh release upload "$GITHUB_REF_NAME" out/*.zip out/*.tar.gz out/*.exe out/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHydra ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md \
              --draft=false
          else
            gh release create "$GITHUB_REF_NAME" out/*.zip out/*.tar.gz out/*.exe out/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHydra ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md
          fi
