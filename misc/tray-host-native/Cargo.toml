[package]
name = "lunarwerx-tray"
version = "1.0.0"
edition = "2021"

# NO dependencies on purpose: every Win32 call this needs is declared inline, so the kit gains a
# tray host without gaining a supply chain, a vendor directory or an offline-build problem.
[dependencies]

# Its own workspace root: cargo never walks up into a host repo's manifest, so the profiles below apply.
[workspace]

# Line tables only in dev and test builds: a panic still names file:line, and links take about half
# the time of full debug info (rust-ci-speed).
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
