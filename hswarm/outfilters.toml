'''


[filters.git-transfer]
description = "git clone/fetch: drop object-transfer progress, keep what was fetched and any error"
match_command = '\bgit(?:\.exe)?\s+(?:-C\s+\S+\s+)?(?:clone|fetch)\b'
strip_lines_matching = [
    '^(?:remote: )?(?:Enumerating objects|Counting objects|Compressing objects|Writing objects|Receiving objects|Resolving deltas|Unpacking objects|Updating files|Total \d+|Delta compression using)\b',
]

[[tests.git-transfer]]
name = "transfer progress goes"
input = '''
Cloning into 'hswarm'...
remote: Enumerating objects: 1520, done.
remote: Counting objects: 100% (1520/1520), done.
Receiving objects: 100% (1520/1520), 2.10 MiB | 8.00 MiB/s, done.
Resolving deltas: 100% (980/980), done.
'''
expected = "Cloning into 'hswarm'..."

[[tests.git-transfer]]
name = "a carriage-return progress redraw collapses and goes, the error stays"
input = "Receiving objects:  50% (760/1520)\rReceiving objects: 100% (1520/1520), done.\nfatal: early EOF"
expected = "fatal: early EOF"
