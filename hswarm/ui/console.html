.t tr.tier td{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);padding-top:10px;border-bottom:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cnt{text-align:right}
details summary{cursor:pointer;color:var(--t2)}
details::details-content{height:0;overflow:clip;transition:height var(--d2) var(--e),content-visibility var(--d2) var(--e) allow-discrete}
details[open]::details-content{height:auto}
/* a collapsed block of a page (progressive disclosure): its summary reads like a section heading */
details.more{margin-top:28px}
details.more>summary{display:flex;align-items:center;gap:6px;list-style:none;min-height:28px;font-size:15px;color:var(--tx);font-weight:600}
details.more>summary .muted{font-weight:400;font-size:13.5px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";font-size:10px;transition:transform var(--d2) var(--e)}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>.more-in>section:first-child{margin-top:8px}
/* inside a table a height animation re-lays out every row on each frame: those open at once */
.t details::details-content{transition:none}
.oc{display:none}
.empty{padding:10px 14px;color:var(--t3)}
/* loading placeholders: flat color, no gradient; the 150ms delay keeps fast loads from flashing them */
.sk{animation:skin var(--d2) var(--e) 150ms both}
.sk i{display:block;height:30px;border-bottom:1px solid var(--bd2);position:relative}
.sk i::after{content:"";position:absolute;left:8px;top:10px;height:10px;width:60%;border-radius:3px;background:var(--bd);animation:skp 1.4s ease-in-out 330ms infinite}
.sk i:nth-child(3n)::after{width:40%}
.pending{animation:skin var(--d2) var(--e) 150ms both}
/* a placeholder that was already on screen before a re-render must not blank out and fade in again */
.sk.held,.pending.held{animation:none}.sk.held i::after{animation-delay:0s}
@keyframes skin{from{opacity:0}}
@keyframes skp{50%{opacity:.55}}

@media (hover:hover){
  a:hover{text-decoration:underline}
  .b:hover:not(:disabled){background:var(--hov)}.b.p:hover:not(:disabled){background:var(--ac);filter:brightness(1.08)}
  #split:hover{background:color-mix(in srgb,var(--ac) 35%,transparent)}
  .tn:hover{background:var(--hov)}
  .tn.sel:hover{background:var(--acs)}
  .star:hover{background:var(--hov)}
  a.tile:hover{text-decoration:none;border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
  /* a hollow star in the tree shows on the row under the pointer or selected; a filled one always shows */
  .tn:not(:hover):not(.sel) .st:not(.on){visibility:hidden}
}
/* tablet and phone: the tree becomes an off-canvas drawer */
@media (max-width:900px){
  header{height:auto;min-height:52px;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
  header .brand,header .muted,header .grow,#ver,#home{display:none}
  #menu{display:inline-flex;align-items:center;justify-content:center;font-size:16px}
  #ptitle{display:block;flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #left{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:30;border-right:0;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);transform:translateX(-100%);visibility:hidden;transition:transform var(--d3) var(--e),visibility 0s linear var(--d3)}
  body.nav #left{transform:none;visibility:visible;box-shadow:0 0 0 1px var(--bd),8px 0 24px rgba(0,0,0,.12);transition:transform var(--d3) var(--e)}
  #scrim{display:block;position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity var(--d2) var(--e)}
  body.nav #scrim{opacity:1;pointer-events:auto}
  #navx{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:44px;min-height:44px}
  #right{width:100%}
  /* the bottom room clears a persistent full-width toast (about 76px on touch), so the last control can scroll above it */
  .pad{padding:16px max(20px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  #status{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));max-width:none;padding:10px 12px;font-size:13.5px}

  body.nav #status{z-index:28}

const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

    const fp = k.fingerprint, o = { p: name, fp }, t = k.priority ?? null, id = "kp-" + fp;
    const c = size.get(t), head = tiers && t !== tier ? `<tr class="tier" data-fk="tier:${esc(t ?? "none")}"><td colspan="${cols}">${t == null ? "No number · used last" : `Priority ${t}`}${c > 1 ? ` · ${c} keys take turns` : ""}</td></tr>` : "";
    tier = t;
    const rs = Math.round(k.resting_s || 0);
    const st = k.disabled ? `${chip("bad", `disabled${k.free_only ? " (:free only)" : ""}`)}${k.reason ? ` <span class="muted" style="font-size:12px">${esc(k.reason)}</span>` : ""}`

    return head + `<tr class="${k.disabled ? "off" : ""}" data-k="${esc(fp)}">${many ? `<td data-l="Priority"><input id="${esc(id)}" class="mono in-pri" inputmode="numeric" autocomplete="off" placeholder="none" value="${esc(t ?? "")}" data-chg="keyPri"${da(o)} aria-label="${esc(`Priority number for key ${fp}`)}"${invalid(id)}>${ferr(id)}</td>` : ""}<td class="mono c1">${esc(k.masked)}</td><td class="mono" data-l="Fingerprint">${esc(fp)}</td><td class="${k.editable ? "muted" : "mono muted"}" style="font-size:11.5px" data-l="Source">${k.editable ? "added here" : esc(k.source)}</td><td data-l="State">${st}</td>
      <td data-l="On">${sw(!k.disabled, "keyOn", o, `Key ${fp} on`)}</td><td class="act">${btn("Check", "keyCheck", o, "", `aria-label="${esc(`Check key ${fp} with ${name}`)}" title="Ask ${esc(name)} whether it accepts this key (free)"`)}${k.editable ? btn("Remove", "keyRm", o, "x", `aria-label="${esc(`Remove key ${fp}`)}"`)
        : `<span class="muted" style="font-size:12px;margin-left:8px" title="${esc(`Comes from ${k.source || "outside your provider file"}; change it there`)}">read-only</span>`}</td></tr>`;
  }).join("")}</table>`) + foldBtn(fk, rows.length, "keys");
}

/* ---------- loads ---------- */
async function loadKeys(p) {
  // Only the newest request lands: an older, slower answer must not overwrite fresher rows.
  const n = KSEQ[p] = (KSEQ[p] || 0) + 1; KLOAD.add(p);
  let r; try { r = await Z.keys(p) } catch (e) { r = { error: e.message } }
  if (KSEQ[p] !== n) return;
  KLOAD.delete(p); KEYS[p] = r;
  if (SEL === pid(p)) renderDetail();
}

  if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); if (MQ.matches) nav(true); $("tq").focus() }
  else if (e.key === "Escape" && !e.defaultPrevented && !MQ.matches && $("detail").contains(t) && !(hasCaret(t) && t.value)) { e.preventDefault(); CUR = SEL; renderTree(true); $("tree").focus() }
});
document.addEventListener("toggle", (e) => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; e.target.open ? OPENDET.add(k) : OPENDET.delete(k);
  if (k.startsWith("d:")) try { sessionStorage.setItem("zs.disc", JSON.stringify([...OPENDET].filter((x) => x.startsWith("d:")))) } catch (err) { console.warn("disclosure state not saved:", err.message) }
  // A task's answer is built only once its row is opened (see dJob).
  if (e.target.open && e.target.classList.contains("lazy") && !e.target.querySelector("pre[data-built]")) renderDetail() }, true);
$("status").addEventListener("click", (e) => { if (!e.target.closest("button")) hideNote() });

/* chart tooltip and keys: the same readout on hover, tap and keyboard focus; built with textContent (labels are data) */
// TIPXY: where the pointer put the tooltip (null when focus did), so a re-render can put it back in the same place.
// TAP0: the mark whose tooltip was showing when the current tap began.
let TIPM = null, TIPXY = null, TAP0 = null;
function showTip(m, x, y) {
  const d = (TIP[m.dataset.c] || [])[+m.dataset.i], el = $("tip"); if (!d) return hideTip();
  TIPXY = x == null ? null : [x, y];
  if (TIPM !== m) {
    TIPM = m; el.textContent = "";
    const h = document.createElement("div"); h.className = "th"; h.textContent = d.h; el.append(h);
    // Values lead, labels follow; a short line keys the series (the role name is ours, never data).
    for (const row of d.rows) { if (!row) continue;
      const [v, l, c] = row, r = document.createElement("div"), k = document.createElement("i"), b = document.createElement("b"), s = document.createElement("span");
      r.className = "tr"; k.className = "lk"; if (c) k.style.background = `var(${c})`; else k.style.visibility = "hidden";
      b.textContent = v; s.textContent = l || ""; r.append(k, b, s); el.append(r) }
    el.hidden = false;
  }
  if (x == null) { const mk = m.querySelectorAll(".mk"), r = (mk[mk.length - 1] || m).getBoundingClientRect(); x = r.right; y = r.top }
  const tw = el.offsetWidth, th = el.offsetHeight; let L = x + 14, T = y - th - 10;
  if (L + tw > innerWidth - 8) L = Math.max(8, x - tw - 14);
  if (T < 8) T = y + 18;
  el.style.transform = `translate(${Math.round(L)}px,${Math.round(T)}px)`;
}
function hideTip() { TIPM = null; $("tip").hidden = true }
const tipAt = (e) => { const m = e.target.closest && e.target.closest(".cm"); if (m) showTip(m, e.clientX, e.clientY); else if (TIPM && TIPM !== document.activeElement) hideTip() };
document.addEventListener("pointermove", tipAt, { passive: true });
document.addEventListener("pointerdown", (e) => { TAP0 = TIPM; tipAt(e) }, { passive: true });
document.addEventListener("focusin", (e) => { const m = e.target.closest && e.target.closest(".cm"); if (m) { ROVE[m.dataset.c] = m.dataset.i; showTip(m) } else if (TIPM) hideTip() });
// WCAG 1.4.13: Escape closes a tooltip first (capture phase, before the detail pane's Escape sends focus to the tree).
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && TIPM) { hideTip(); e.preventDefault() } }, true);
document.addEventListener("focusout", (e) => { if (e.target === TIPM) hideTip() });
$("right").addEventListener("scroll", () => { if (TIPM) hideTip() }, { passive: true });
// One tab stop per chart: arrows (and Home/End) move between its marks; Enter or Space opens a mark that links somewhere.
document.addEventListener("keydown", (e) => {
  const m = e.target.closest && e.target.closest(".cm"); if (!m || !m.ownerSVGElement) return;
  // Marks painted out of axis order (the scatter) carry their place along it in data-o: the arrows follow that.
  const all = [...m.ownerSVGElement.querySelectorAll(".cm")]; if (m.dataset.o != null) all.sort((a, b) => a.dataset.o - b.dataset.o);
  const i = all.indexOf(m);
  const j = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: all.length - 1 }[e.key];
  if (j != null) { e.preventDefault(); const n = all[Math.max(0, Math.min(all.length - 1, j))]; m.setAttribute("tabindex", "-1"); n.setAttribute("tabindex", "0"); n.focus() }
  else if ((e.key === "Enter" || e.key === " ") && m.dataset.act && ACT[m.dataset.act]) { e.preventDefault(); ACT[m.dataset.act](m.dataset, m) }
});
// Charts are drawn for the width they are shown at: a new width (window, split pane, rotation) redraws the page once it settles.
let RZT;
new ResizeObserver(() => { clearTimeout(RZT); RZT = setTimeout(() => { if (Z.S && BOOTED && cwf() !== CWF) { hideTip(); renderDetail() } }, 150) }).observe($("right"));

/* tree keyboard and search */
$("tree").addEventListener("keydown", (e) => {
  const i = FLAT.findIndex((r) => r.id === CUR), r = FLAT[i]; if (!r) return;
  const mv = (j) => { j = Math.max(0, Math.min(FLAT.length - 1, j)); CUR = FLAT[j].id; renderTree(true) };
  switch (e.key) {
    case "ArrowDown": mv(i + 1); break;
    case "ArrowUp": if (i === 0) $("tq").focus(); else mv(i - 1); break;
    case "Home": mv(0); break;
    case "End": mv(FLAT.length - 1); break;
    case "ArrowRight": if (r.hasKids && !r.open) { FX.tree = snapTree(r.id); EXP.add(r.id); saveExp(); renderTree(true) } else if (r.hasKids) mv(i + 1); break;
    case "ArrowLeft": if (r.hasKids && r.open && !r.forced) { FX.tree = snapTree(r.id); EXP.delete(r.id); saveExp(); renderTree(true) } else if (r.parent) { CUR = r.parent; renderTree(true) } break;
    case "Enter": case " ": if (r.n.act) { ACT[r.n.act](); break } select(r.sel); CUR = r.id; renderTree(true); nav(false, true); break;
    // In the drawer, Escape falls through to the document handler, which closes it.
    case "Escape": if (MQ.matches) return; $("tq").focus(); break;
    default: return;
  }
  e.preventDefault();
});
$("tq").addEventListener("input", (e) => { TQ = e.target.value; renderTree() });
$("tq").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" && FLAT.length) { e.preventDefault(); const h = FLAT.find((r) => r.n.hit) || FLAT[0]; CUR = h.id; renderTree(true); $("tree").focus() }
  else if (e.key === "Enter") { const h = FLAT.find((r) => r.n.hit && !r.hasKids) || FLAT.find((r) => r.n.hit); if (h) { select(h.sel); nav(false, true) } }
  // Escape clears the search first; a second Escape (empty field) moves to the tree, or closes the drawer.
  else if (e.key === "Escape" && e.target.value) { e.target.value = ""; TQ = ""; renderTree(); e.stopPropagation() }
  else if (e.key === "Escape" && !MQ.matches) { e.preventDefault(); $("tree").focus() }
});
// Back/Forward (and the phone's back gesture) move between objects; an empty hash is the Overview.
const onHistory = () => { const h = location.hash.slice(1) || "overview"; if (h !== SEL) { select(h, { hist: "none" }); nav(false) } };
window.addEventListener("popstate", onHistory); window.addEventListener("hashchange", onHistory);
MQ.addEventListener("change", () => nav(false));

/* resizable tree pane (desktop only: on phones and tablets the tree is a drawer with its own width) */
(function () {
  const sp = $("split"), left = $("left"); let x0 = null, w0 = 0;
  const max = () => Math.max(220, Math.min(620, innerWidth - 360));
  const set = (w) => { w = Math.round(Math.max(220, Math.min(max(), w))); document.documentElement.style.setProperty("--tw", w + "px");
    sp.setAttribute("aria-valuenow", w); sp.setAttribute("aria-valuemax", max()); return w };
  set(LS("w", 300));
  sp.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" || MQ.matches) return; x0 = e.clientX; w0 = left.getBoundingClientRect().width; sp.setPointerCapture(e.pointerId); sp.classList.add("on"); e.preventDefault() });
  sp.addEventListener("pointermove", (e) => { if (x0 != null) set(w0 + e.clientX - x0) });
  const end = () => { if (x0 == null) return; x0 = null; sp.classList.remove("on"); SV("w", left.getBoundingClientRect().width) };
  sp.addEventListener("pointerup", end); sp.addEventListener("pointercancel", end);
  sp.addEventListener("dblclick", () => SV("w", set(300)));
  sp.addEventListener("keydown", (e) => {
    const w = left.getBoundingClientRect().width, to = { ArrowLeft: w - 16, ArrowRight: w + 16, Home: 220, End: max(), Enter: 300 }[e.key];
    if (to != null) { e.preventDefault(); SV("w", set(to)) }
  });
})();

/* ---------- boot ---------- */
function render() {
  if (!Z.S) return;
  ICONV = Object.fromEntries(Z.S.providers.filter((p) => p.icon === "ok").map((p) => [p.name, p.icon_v]));
  if (!ICONS_ASKED && Z.S.providers.some((p) => p.icon === "unknown")) { ICONS_ASKED = true; Z.fetchIcons().catch(() => {}) }
  $("ver").textContent = "v" + Z.S.version; $("ver").title = "Settings folder: " + Z.S.home;
  // Adding your own provider or model is for later: before the first key, the page's one way in is the provider list.
  $("navfoot").hidden = !Z.S.providers.some((p) => p.keys > 0);
  const rp = Z.readyProviders();
  // First visit: the Models filter hides keyless providers only once some provider can run.
  if (MF.withKeys == null) { MF.withKeys = rp.size > 0; saveMF() }
  // Open the Models branch the first time a provider becomes ready, unless the user already chose.
  if (!EXPM && rp.size) { EXPM = true; SV("expm", true); if (!EXP.has("models")) { EXP.add("models"); saveExp() } }
  if (!BOOTED) {
    BOOTED = true; select(SEL, { hist: "none" });
    // select() already loaded what its page needs; load only the rest.
    if (!SEL.startsWith("jobs")) loadJobs();
    if (CLIENTS == null && !/^(clients|overview)/.test(SEL)) loadClients();
    return;
  }
  renderTree(); renderDetail();
  if (FX.star) { popStar(FX.star); delete FX.star }
}
nav(false);
Z.onState(render); Z.refresh().catch(showError);
</script>
