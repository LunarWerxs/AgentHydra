# OpenRouter: one endpoint in front of ~440 models, and every key is its own account.
# Any of its ids works without a file change as `or:<id>` (`or:<id>#<host>` pins one host).
# `balance_authority = "status"`: /credits reads negative on keys that still serve (free grants
# are not counted), so only a real 402 parks a key. The two headers are public attribution, not secrets.

base_url = "https://openrouter.ai/api/v1"
about = "One account for hundreds of models from many companies. Paid per use; a few models are free."
key_url = "https://openrouter.ai/settings/keys"  # where a person makes an API key
website = "https://openrouter.ai"  # the company's site; the console shows its favicon
options = ["reasoning", "reasoning_effort", "provider", "transforms", "models", "route", "usage"]
models_path = "/models"
balance_path = "/key"
credits_path = "/credits"
balance_authority = "status"
check_model = "openai/gpt-oss-20b:free"  # the key check chats with it: /key answers 200 for deleted accounts
check_model_free = true  # https://openrouter.ai/docs/guides/routing/model-variants/free
headers = {HTTP-Referer = "https://github.com/LunarWerxs/AgentHydra", X-Title = "HydraSwarm"}
passthrough = ["or:", "openrouter:"]
anthropic_url = "https://openrouter.ai/api"
anthropic_auth = "bearer"
docs = "https://openrouter.ai/docs"

# The same model through OpenRouter, steered to DeepInfra (fp8) with `order` and fallbacks on (a strict pin
# 404s when the host is down). A FALLBACK: benchmarked 2026-09-17, every OpenRouter path found a planted bug
# in code review 11/20 against 10/10 direct, at ~3.5x the latency. Cheaper at peak, which does not buy a
# review regression. `fallback = false` in your own openrouter.toml promotes it.
[models.deepseek-flash-or]
api_id = "deepseek/deepseek-v4.1-flash"
ctx = 1000000
max_out = 384000
# DeepInfra host price (HF router listing, 2026-10-03); OpenRouter reports the real cost per call.
price = {hit = 0.006, miss = 0.2, out = 0.6}
extra ={provider = {order = ["deepinfra"], allow_fallbacks = true}}
fallback = true

# Models with a `benchmark_slug` take part in AUTO: the slug names their published scores in
# data/published-models.json. `inherits` copies another model's settings; the lines below it
# change what differs.
[models."rank:claude-opus-5-5"]
api_id = "anthropic/claude-opus-5.5"
benchmark_slug = "claude-opus-5-5"
ctx = 1000000
max_out = 128000
vision = true
tools = true
price_ref = "openrouter/rank:claude-opus-5-5"
default_reasoning_effort = "max"
default_thinking = true
cc_effort = true

