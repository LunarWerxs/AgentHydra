# Mistral la Plateforme. It answers 422 to the extra `user` field, hence `omit`.
# Retired from routing 2026-09-23 (a day on mistral cost ~$607): its models are reached by name only.

base_url = "https://api.mistral.ai/v1"
about = "Mistral's own models. Has a free tier."
key_url = "https://console.mistral.ai/api-keys"  # where a person makes an API key
website = "https://mistral.ai"  # the company's site; the console shows its favicon
free_tier = true  # free terms may keep what is sent: HSWARM_REDACT_FREE_TIER redacts tasks here
models_path = "/models"
omit = ["user"]
docs = "https://docs.mistral.ai/api/"

# Mistral models are reached by name only (retired from every route 2026-09-23).
[models.magistral-medium]
api_id = "magistral-medium-latest"
ctx = 131072
price = {hit = 2.0, miss = 2.0, out = 5.0}
# UNVERIFIED: Magistral Medium is no longer on mistral.ai/pricing/api (checked 2026-10-03); the price is the last published one.

[models.ministral-8b]
api_id = "ministral-8b-latest"
ctx = 131072
price_ref = "mistral/ministral-8b"

[models."mistral-medium-3.5"]
api_id = "mistral-medium-3.5"
ctx = 131072
price_ref = "mistral/mistral-medium-3.5"
fallback = true
