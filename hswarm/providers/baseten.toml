# Baseten's shared Model APIs, not a user's dedicated deployment URL.
base_url = "https://inference.baseten.co/v1"
about = "Hosted language models through Baseten's OpenAI-compatible Model APIs."
website = "https://www.baseten.co"
key_url = "https://app.baseten.co/settings/api_keys"
docs = "https://docs.baseten.co/inference/model-apis/overview"
transport = "openai"
capabilities = ["chat"]
key_billing = "unknown"
models_path = "/models"
passthrough = ["baseten:"]
options = ["reasoning_effort"]
anthropic_url = "facade"

