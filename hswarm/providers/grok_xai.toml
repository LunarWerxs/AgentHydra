base_url = "https://api.x.ai/v1"
about = "xAI's Grok models through the Chat Completions API."
website = "https://x.ai"
key_url = "https://console.x.ai"
docs = "https://docs.x.ai/developers/model-capabilities/legacy/chat-completions"
transport = "openai"
capabilities = ["chat"]
key_env = ["XAI_API_KEYS", "XAI_API_KEY", "GROK_XAI_API_KEYS", "GROK_XAI_API_KEY"]
key_billing = "unknown"
models_path = "/models"
passthrough = ["xai:", "grok_xai:"]
options = ["reasoning_effort"]
anthropic_url = "facade"

# Ranked routes (owner, 2026-10-07). Context, tool support and per-token prices come from docs.x.ai/developers/models/<model>.
# Prompts of 200,000 tokens or more pay the higher rate for the whole request.
[models."rank:grok-4-3:grok_xai"]
api_id = "grok-4.3"
benchmark_slug = "grok-4-3"
ctx = 1000000
tools = true
price_ref = "grok_xai/rank:grok-4-3:grok_xai"
cc_effort = false

