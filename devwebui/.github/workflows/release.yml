name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build the compiled binary on
# each OS and publish them to a GitHub Release. The single self-contained binary IS the product,
# so it ships as a first-class, CI-produced artifact rather than a local build.
#
# NOTE: arch labels below are nominal (ubuntu→x64, macos-latest→arm64). Adjust the matrix /
# `bun build --compile --target` in scripts/build.ts if you need additional arch variants.

on:
  push:
    tags: ["v*"]

  # Manual runs, so a commit or tag can be built without waiting on a webhook. Added 2026-08-06
  # during a GitHub Actions incident whose recovery plan was to THROTTLE webhook triggers: pushes
  # and tag pushes landed and produced no run at all. Dispatching on a TAG ref still satisfies the
  # `github.ref_type == 'tag'` gate on the publish job below, so it is a real release.
  # Dispatching on a BRANCH is not a supported path here: the validate job resolves the version
  # from the ref name, so it fails fast on the metadata check rather than publishing anything.
  # The gate is what guarantees the second half of that, whatever the ref turns out to be.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    timeout-minutes: 60
    name: validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify version and changelog
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          package_ver="$(node -p "require('./package.json').version")"
          if [ "$package_ver" != "$ver" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${package_ver}"
            exit 1
          fi
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no release section for ${GITHUB_REF_NAME}"
            exit 1
          fi

  build:
    timeout-minutes: 60
    name: build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile # root workspace install covers web/ too
      - run: bun run dist # scripts/build.ts — web build + `bun build --compile`
      - name: Smoke-test the actual release executable
        shell: bash
        run: |
          if [ -f dist/devwebui.exe ]; then bin=dist/devwebui.exe; else bin=dist/devwebui; fi
          bun run scripts/smoke-release.ts "$bin"
      - name: Package release assets
        shell: bash
        run: |
          mkdir -p out
          target="${{ matrix.target }}"
          if [ -f dist/devwebui.exe ]; then
            cp dist/devwebui.exe "out/devwebui-${target}.exe"
            (cd dist && 7z a -tzip "$GITHUB_WORKSPACE/out/devwebui-${target}.zip" devwebui.exe > /dev/null)
            # A THIRD Windows asset: the same executable plus the misc/ tray toolkit, for anyone who
            # wants the notification-area icon rather than a bare window. DevWebUI draws no tray icon
            # itself — misc/lunarwerx-tray.exe does, as a separate launcher — so without these files
            # a downloaded build simply cannot have one, whatever the app's settings say.
            #
            # Deliberately a SEPARATE asset: the zip above is the auto-updater's transport, and the
            # updater matches its asset by exact name, so this one cannot be picked up by mistake.
            tray="devwebui-${target}-with-tray"
            mkdir -p "tmp/${tray}/misc"
            cp dist/devwebui.exe "tmp/${tray}/"
            cp misc/lunarwerx-tray.exe misc/DevWebUI-Tray.json misc/DevWebUI.ico \
               misc/Create-Shortcut.ps1 misc/New-TrayShortcut.ps1 \
               misc/Tray-Host.ps1 misc/DevWebUI-Tray.ps1 misc/Tray-Launch.vbs \
               "tmp/${tray}/misc/"
            (cd tmp && 7z a -tzip "$GITHUB_WORKSPACE/out/${tray}.zip" "$tray" > /dev/null)
            # The toolkit is the entire point of this asset, and a bundle missing it still looks
            # fine, so assert rather than hope.
            for f in lunarwerx-tray.exe DevWebUI-Tray.json DevWebUI.ico Create-Shortcut.ps1 \
                     New-TrayShortcut.ps1 Tray-Host.ps1 DevWebUI-Tray.ps1 Tray-Launch.vbs; do
              test -f "tmp/${tray}/misc/$f" || { echo "::error::tray bundle is missing misc/$f"; exit 1; }
            done
          elif [ -f dist/devwebui ]; then
            tar -C dist -czf "out/devwebui-${target}.tar.gz" devwebui
          else
            echo "::error::no compiled binary found in dist/"; ls -la dist || true; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devwebui-${{ matrix.target }}
          path: out/*
          # Only carries the binaries to the publish job below; the release itself keeps them.
          retention-days: 1

  release:
    timeout-minutes: 60
    name: publish release
    # Only a TAG publishes. A workflow_dispatch on a branch is a build + smoke validation
    # of the pipeline; dispatching on a tag ref still lands here and publishes for real.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no release section for ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Build checksums
        shell: bash
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum |
            sed -E 's#  artifacts/[^/]+/#  #' > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
