# Test preload isolates the suite's data dir (DEVWEBUI_HOME → a temp dir) so tests never
# pollute the real ~/.devwebui error log / runtime pointer. See tests/setup.ts.
[test]
preload = ["./tests/setup.ts"]

# Supply-chain posture: a published version is not installable until it has been public for 3 days
# (259200s), so a compromised or yanked release is normally caught upstream before it can resolve
# here. A frozen install against a complete lockfile is untouched; only a re-resolution (bun add,
# bun update, an incomplete lock) re-checks ages - lower it for that one command if a pin is young,
# and put it back before committing. Odin's bumper bumps under this same cooldown.
[install]
minimumReleaseAge = 259200
